# Grafana data sources — auto-provisioned on startup.
# Both Prometheus and the OTel Collector expose compatible endpoints.

apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
  - name: IndicAST OTel Collector
    type: prometheus
    access: proxy
    url: http://otel-collector:8888
    isDefault: false
    editable: false