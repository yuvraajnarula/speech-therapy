# Prometheus scrape configuration for the Speech Therapy platform.
# Scrapes the FastAPI /metrics endpoint and the OTel Collector itself.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "indicast-fastapi"
    static_configs:
      - targets: ["app:8000"]
    metrics_path: /metrics
    scrape_interval: 5s
    scrape_timeout: 4s
    params:
      module: [default]

  - job_name: "indicast-otel-collector"
    static_configs:
      - targets: ["otel-collector:8888"]
    metrics_path: /metrics

  - job_name: "indicast-redis"
    static_configs:
      - targets: ["redis:6379"]
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: "indicast-postgres"
    static_configs:
      - targets: ["postgres:5432"]
    metrics_path: /metrics
    scrape_interval: 10s