# Speech Therapy MBP — Production Infrastructure
#
# Observability stack (Prometheus + Grafana + OpenTelemetry collector)
# Run alongside the main docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#
# Dashboards:
#   Grafana UI:   http://localhost:3000  (admin / admin)
#   Prometheus:   http://localhost:9090
#   OTel Collector: http://localhost:8888/metrics

version: "3.9"

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: indicast-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/data
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/data"
      - "--web.enable-lifecycle"
    networks:
      - indicast

  grafana:
    image: grafana/grafana:latest
    container_name: indicast-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/ds.yml:ro
    depends_on:
      - prometheus
    networks:
      - indicast

  otel-collector:
    image: otel/opentelemetry-collector:0.110.0
    container_name: indicast-otel-collector
    restart: unless-stopped
    ports:
      - "8888:8888"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./observability/otel-config.yml:/etc/otel-collector-config.yml:ro
    command: ["--config=/etc/otel-collector-config.yml"]
    depends_on:
      - app
    networks:
      - indicast

volumes:
  prometheus_data:
  grafana_data:

networks:
  indicast:
    driver: bridge
    external: true
    name: indicast