version: '3.8'

services:
  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: speechtherapy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: speech_therapy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d speech_therapy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # MinIO (Local S3 Compatible Storage)
  # ============================================================================
  minio:
    image: minio/minio:latest
    container_name: speechtherapy_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Setup MinIO Bucket
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set localminio http://minio:9000 minioadmin minioadminpassword;
      mc mb --ignore-existing localminio/speech-therapy-clinical-audio;
      exit 0;
      "

  # ============================================================================
  # Backend API & Live AST WebSocket Service
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: speechtherapy_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://postgres:postgres_secure_password_dev@postgres:5432/speech_therapy
      SECRET_KEY: enterprise-super-secret-key-change-in-production-min32bytes!
      STORAGE_BACKEND: s3
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadminpassword
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET_NAME: speech-therapy-clinical-audio
      ENABLE_HIPAA_LOG_REDACTION: "true"
      ENCRYPT_AUDIO_AT_REST: "true"
      DEFAULT_STT_MODEL: "small"
      STT_DEVICE: "cpu"
      STT_COMPUTE_TYPE: "int8"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - huggingface_cache:/root/.cache/huggingface

  # ============================================================================
  # Frontend Client
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: speechtherapy_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  minio_data:
  huggingface_cache:
