# Speech Therapy MBP — Production Infrastructure
#
# Services:
#   - redis        : Celery broker + result backend + clinical memory layer
#   - postgres     : Primary transactional database (HIPAA-grade)
#   - app          : FastAPI application (uvicorn)
#   - worker       : Celery async worker for batch exports / analytics
#   - beat         : Celery beat scheduler (periodic cleanup, etc.)
#
# All services are wired behind a shared Docker network so the app can
# reference peers by service name (e.g. redis:6379, postgres:5432).

version: "3.9"

x-common-env: &common-env
  ENVIRONMENT: ${ENVIRONMENT:-production}
  REDIS_URL: redis://redis:6379/0
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/speech_therapy

services:
  # ---------------------------------------------------------------------------
  # Redis — broker, backend, and clinical memory store
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: indicast-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --save 60 1
      --save 300 1
      --save 3600 1
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - indicast

  # ---------------------------------------------------------------------------
  # PostgreSQL — transactional data store
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: indicast-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: speech_therapy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d speech_therapy"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - indicast

  # ---------------------------------------------------------------------------
  # FastAPI Application
  # ---------------------------------------------------------------------------
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: indicast-app
    restart: unless-stopped
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/speech_therapy
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - indicast

  # ---------------------------------------------------------------------------
  # Celery Worker — async batch jobs
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: indicast-worker
    restart: unless-stopped
    command: >
      celery -A backend.app.worker.celery_app worker
      --loglevel=info
      --concurrency=4
      --max-tasks-per-child=1000
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/speech_therapy
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - indicast

  # ---------------------------------------------------------------------------
  # Celery Beat — periodic task scheduler
  # ---------------------------------------------------------------------------
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: indicast-beat
    restart: unless-stopped
    command: >
      celery -A backend.app.worker.celery_app beat
      --loglevel=info
      --pidfile=/tmp/celerybeat.pid
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/speech_therapy
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - indicast

volumes:
  redis_data:
  postgres_data:

networks:
  indicast:
    driver: bridge